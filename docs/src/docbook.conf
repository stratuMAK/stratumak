include::docbook-image.conf[]

# asciidoc's docbook backend stops at [sect4], but chapters are included at a
# level offset, so a ==== heading inside one lands at depth 5 and asciidoc
# warns "missing section: [sect5]" -- 660 lines of it across 262 sites, and the
# heading is dropped from the output. DocBook nests <section> freely, so this
# mirrors the stock [sect4] one level down.
[sect5]
<section{id? id="{id}"}{role? role="{role}"}{reftext? xreflabel="{reftext}"}>
<title>{title}</title>
|
</section>
