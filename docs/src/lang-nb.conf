#
# AsciiDoc Norwegian Bokmål language configuration file.
#
# asciidoc ships no lang-nb.conf, and the docs list nb among the translation
# languages, so every master document warned "missing language conf file".
# Structure mirrors /etc/asciidoc/lang-en.conf; only the captions differ.
#
[attributes]
# Captions, used by (X)HTML backends.
# Captions on RHS are displayed in outputs.
ifdef::basebackend-html[]

caution-caption=Obs
important-caption=Viktig
note-caption=Notat
tip-caption=Tips
warning-caption=Advarsel
figure-caption=Figur
table-caption=Tabell
example-caption=Eksempel
toc-title=Innholdsfortegnelse
appendix-caption=Tillegg
# Man page NAME section title.
manname-title=NAVN

[footer-text]
Version {revnumber}{basebackend-xhtml11?<br />}{basebackend-xhtml11=<br>}
Last updated
template::[footer-date]

endif::basebackend-html[]


[specialsections]
# DocBook special sections.
# The regular expression on LHS is matched against source titles.
ifdef::basebackend-docbook[]

ifdef::doctype-article[]
^Abstract$=abstract
endif::doctype-article[]

ifdef::doctype-book[]
^Colophon$=colophon
^Dedication$=dedication
^Preface$=preface
endif::doctype-book[]

^Index$=index
^(Bibliography|References)$=bibliography
^Glossary$=glossary
^Appendix [A-Z][:.](?P<title>.*)$=appendix

endif::basebackend-docbook[]

ifdef::doctype-manpage[]
(?i)^SYNOPSIS$=synopsis
endif::doctype-manpage[]
