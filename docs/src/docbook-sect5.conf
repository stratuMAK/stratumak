# asciidoc's docbook backend defines [sect1] through [sect4] only.  Chapters
# are included at a level offset, so a ==== heading inside one lands at depth 5
# and asciidoc warns "missing section: [sect5]" and drops the section from the
# output.  DocBook nests <section> freely, so this mirrors the stock [sect4]
# one level down.
#
# This lives in its own file rather than in attribute-colon.conf because that
# one is shared with xhtml11.conf, where a DocBook <section> template would be
# emitted straight into the HTML.  Both DocBook consumers include it: the
# document build via docbook.conf, and the objects/%.links-stamp pass, which
# runs the docbook backend to harvest cross-reference anchors and would
# otherwise miss every id nested at depth 5.
[sect5]
<section{id? id="{id}"}{role? role="{role}"}{reftext? xreflabel="{reftext}"}>
<title>{title}</title>
|
</section>
