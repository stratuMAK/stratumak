# Realtime needs locked memory.
#
# Shipped as a conffile so dpkg owns it: installing, upgrading and purging the
# package add and remove this limit with no maintainer-script editing of the
# shared /etc/security/limits.conf.
#
# pam_limits reads limits.conf first, then limits.d/*.conf, so this entry wins
# over a stale "#EMC2" line an earlier LinuxCNC install may have left behind.
* - memlock 20480
