# vim: sw=2

name: Build CI

on:
  push:
    # Unfiltered push + pull_request would run everything twice for every PR
    # branch push. Branch work is covered by the pull_request trigger.
    branches: [gomc]
    tags: ['*']
  pull_request:
  release:
    types: [published]
  check_suite:
    types: [rerequested]
  # Manual trigger for the gated heavy jobs (packages, docs) without a release.
  workflow_dispatch:

# Job gating policy for this fork (upstream runs everything on every push):
#   - gomc + rip-and-test + static-checks: every push and PR — the merge gates.
#   - rip-and-test-clang, htmldocs: post-merge pushes to gomc only.
#   - package-*: releases/tags (feeds the release job) or manual dispatch.

permissions:
  contents: read #  to fetch code (actions/checkout)

jobs:

  rip-and-test:
    runs-on: ubuntu-24.04
    steps:
    - name: Dump GitHub context
      env:
        GITHUB_CONTEXT: ${{ toJson(github) }}
      run: echo "$GITHUB_CONTEXT"
    - uses: actions/checkout@v2
      with:
        submodules: true
        fetch-depth: 0
    - run: git fetch --recurse-submodules=no https://github.com/linuxcnc/linuxcnc +refs/tags/*:refs/tags/*
    - name: Build RIP & test
      run: |
        set -x
        sudo apt-get install -y eatmydata
        eatmydata ./scripts/travis-install-build-deps.sh
        cd src
        eatmydata ./autogen.sh
        eatmydata ./configure --with-realtime=uspace --disable-check-runtime-deps
        eatmydata make -O -j$((1+$(nproc))) default pycheck V=1
        # Note that the package build covers html docs
        eatmydata ../scripts/rip-environment runtests -p
    - name: Upload failure logs
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: runtests-failure-logs
        path: |
          tests/**/server.log
          tests/**/result
          tests/**/stderr
          tests/**/out.motion-logger
        if-no-files-found: ignore

  rip-and-test-clang:
    runs-on: ubuntu-24.04
    if: github.event_name == 'push' && github.ref == 'refs/heads/gomc'
    steps:
    - name: Dump GitHub context
      env:
        GITHUB_CONTEXT: ${{ toJson(github) }}
      run: echo "$GITHUB_CONTEXT"
    - uses: actions/checkout@v2
      with:
        submodules: true
        fetch-depth: 0
    - run: git fetch --recurse-submodules=no https://github.com/linuxcnc/linuxcnc +refs/tags/*:refs/tags/*
    # The RT function-effects check downloads a pinned clang (see
    # scripts/rt-clang.sh) — cache it so post-merge runs don't re-download.
    - name: Cache pinned RT-check clang
      uses: actions/cache@v4
      with:
        path: ~/.cache/linuxcnc-rt-clang
        key: rt-clang-22.1.8-${{ runner.arch }}
    - name: Clang build RIP & test
      run: |
        set -x
        sudo apt-get install -y eatmydata
        eatmydata ./scripts/travis-install-build-deps.sh
        sudo eatmydata apt-get install -y clang
        cd src
        eatmydata ./autogen.sh
        CC=clang CXX=clang++ eatmydata ./configure --with-realtime=uspace --disable-check-runtime-deps
        eatmydata make -O -j$((1+$(nproc))) default pycheck V=1
        # RT path verification: clang function-effects analysis over the
        # RTAPI/HAL core and every generated component (warnings = errors).
        eatmydata make rt-effects-check
        # Note that the package build covers html docs
        eatmydata ../scripts/rip-environment runtests -p

  # gomc gate: build + Go vet/tests + pinned lint (no NEW findings vs the
  # gomc merge base) + fmt + C-warning gate on gomc-owned paths. The make
  # targets are the source of truth (src/gomc/Submakefile); this job only
  # orchestrates them. The full runtests suite runs once per PR, in
  # rip-and-test (which uploads the failure logs).
  gomc:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@v2
      with:
        submodules: true
        fetch-depth: 0
    - run: git fetch --recurse-submodules=no https://github.com/linuxcnc/linuxcnc +refs/tags/*:refs/tags/*
    - uses: actions/setup-go@v5
      with:
        go-version: '1.24.x'
        # go.sum is build-generated (not in the repo), so setup-go's automatic
        # cache keying cannot work; the module cache is small enough to skip.
        cache: false
    - name: Install golangci-lint (pinned — keep in sync with GOLANGCI_LINT_VERSION in src/gomc/Submakefile)
      run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2
    - name: Build RIP
      run: |
        set -x
        sudo apt-get install -y eatmydata
        eatmydata ./scripts/travis-install-build-deps.sh
        cd src
        eatmydata ./autogen.sh
        eatmydata ./configure --with-realtime=uspace --disable-check-runtime-deps
        eatmydata make -O -j$((1+$(nproc))) default V=1 2>&1 | tee ../build.log
        test "${PIPESTATUS[0]}" -eq 0
    - name: C warning gate (gomc-owned paths)
      run: ./scripts/check-gomc-cwarnings build.log
    - name: Go tests + lint + fmt gate
      run: |
        export PATH="$PATH:$HOME/go/bin"
        cd src
        make gomc-check GOMC_LINT_BASE=origin/gomc
    - name: Upload failure logs
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: gomc-failure-logs
        path: build.log
        if-no-files-found: ignore

  # Scoped, enforcing static analysis (shellcheck over fork-owned shell,
  # cppcheck over gomc-owned C). Needs no RIP build — fast fail on every PR.
  static-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v2
      with:
        submodules: true
    - name: Install analyzers
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends cppcheck shellcheck
    - name: Static checks (gomc-owned shell + C)
      run: ./scripts/check-static

  # Webapp gate: ESLint + cold vue-tsc type-check + vitest over the five
  # non-deferred webapps (classicladder is frozen/excluded). Self-contained
  # (npm only, no RIP build) like static-checks — a fast merge gate on every
  # push and PR. scripts/check-webapps.sh is the source of truth; keep its app
  # lists in sync with the local `make webapp-lint`/`webapp-test` targets.
  webapps:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v2
    - uses: actions/setup-node@v4
      with:
        node-version: '20'
    - name: Webapp lint + type-check + tests
      run: ./scripts/check-webapps.sh

  htmldocs:
    runs-on: ubuntu-24.04
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/gomc') ||
      github.event_name == 'release' ||
      github.event_name == 'workflow_dispatch'
    steps:
    - name: Dump GitHub context
      env:
        GITHUB_CONTEXT: ${{ toJson(github) }}
      run: echo "$GITHUB_CONTEXT"
    - uses: actions/checkout@v2
      with:
        submodules: true
        fetch-depth: 0
    - run: git fetch --recurse-submodules=no https://github.com/linuxcnc/linuxcnc +refs/tags/*:refs/tags/*
    - name: Build HTML docmentation
      run: |
        ./scripts/travis-install-build-deps.sh
        sudo apt-get install -y eatmydata
        cd src
        eatmydata ./autogen.sh
        eatmydata ./configure --with-realtime=uspace --disable-check-runtime-deps --enable-build-documentation=html
        eatmydata make -O -j$((1+$(nproc))) manpages
        eatmydata make -O -j$((1+$(nproc))) translateddocs
        eatmydata make -O -j$((1+$(nproc))) docs
        # Note that the package build covers html docs

  package-arch:
    runs-on: ${{ matrix.runner }}
    if: >-
      github.event_name == 'release' ||
      startsWith(github.ref, 'refs/tags/') ||
      github.event_name == 'workflow_dispatch'
    strategy:
      matrix:
        runner: ["ubuntu-24.04", "ubuntu-24.04-arm"]
        image: ["debian:bullseye", "debian:bookworm", "debian:trixie", "debian:sid"]
    container:
      image: ${{ matrix.image }}
      # IPC_OWNER is needed for shmget IPC_CREAT
      # SYS_ADMIN is needed for shmctl IPC_SET
      options: --cpus=2 --cap-add=IPC_OWNER --cap-add=SYS_ADMIN
    steps:
    - name: Dump GitHub context
      env:
        GITHUB_CONTEXT: ${{ toJson(github) }}
      run: echo "$GITHUB_CONTEXT"
    - name: Install pre-dependencies
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        set -e
        set -x
        apt-get --quiet update
        apt-get --yes --quiet install eatmydata curl
        eatmydata apt --quiet --yes upgrade
        # Install stuff needed to check out the linuxcnc repo and turn it into a debian source package.
        eatmydata apt-get --yes --quiet install --no-install-suggests git lsb-release python3 devscripts

    - uses: actions/checkout@v3
      with:
        # "fetch-depth: 0" fetches all of history, this is needed by
        # our build system to determine the version from tags
        fetch-depth: 0

    - name: Add linuxcnc.org deb archive
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        case "${{matrix.image}}" in
            debian:sid|debian:bookworm|debian:trixie)
                exit 0
                ;;
            *)
                ;;
        esac
        set -e
        set -x
        eatmydata apt-get --yes --quiet install --no-install-recommends gpg software-properties-common
        eatmydata gpg --homedir="${PWD}/gnupg" --output /etc/apt/trusted.gpg.d/linuxcnc-deb-archive.gpg --export 3CB9FD148F374FEF
        DIST=$(echo ${{matrix.image}} | cut -d : -f 2)
        eatmydata add-apt-repository "deb http://linuxcnc.org $DIST base"
        eatmydata apt-get --quiet update

    - name: Build architecture-specific Debian packages
      env:
        DEBEMAIL: emc-developers@lists.sourceforge.net
        DEBFULLNAME: LinuxCNC Github CI Robot
        DEBIAN_FRONTEND: noninteractive
      run: |
        set -e
        set -x
        eatmydata git config --global --add safe.directory "${PWD}"
        eatmydata debian/configure
        eatmydata debian/update-dch-from-git
        eatmydata scripts/get-version-from-git | sed -re 's/^v(.*)$/\1/' >| VERSION; cat VERSION
        eatmydata git diff
        eatmydata apt-get --yes --quiet build-dep --arch-only .
        eatmydata debuild -us -uc --build=any
    - name: Test debian packages
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        set -e
        set -x
        eatmydata apt-get --yes --quiet install ../*.deb
        eatmydata apt-get --yes --quiet install sudo # some tests run sudo...
        eatmydata adduser --disabled-password --gecos "" testrunner
        eatmydata passwd -d testrunner
        eatmydata adduser testrunner sudo
        chmod 0777 $(find tests/ -type d) # make test dirs world-writable for the testrunner
        su -c "eatmydata ./scripts/runtests -p ./tests" testrunner
    - name: Gather build artifacts
      run: |
        set -e
        set -x
        ARCH=$(dpkg --print-architecture)
        DIST=$(echo ${{ matrix.image }} | cut -d : -f 2)
        OUTDIR="artifacts/${DIST}/${ARCH}"
        mkdir -p "$OUTDIR"
        cp -v ../*.deb ../*.changes ../*.buildinfo "$OUTDIR" || true
        (cd "$OUTDIR" && sha256sum * > SHA256SUMS.txt)
        echo "DIST=$DIST" >> "$GITHUB_ENV"
        echo "ARCH=$ARCH" >> "$GITHUB_ENV"
    - name: Compute artifact metadata
      id: meta
      run: |
        echo "dist=$(echo ${{ matrix.image }} | cut -d : -f 2)" >> $GITHUB_OUTPUT
        echo "arch=$(dpkg --print-architecture)" >> $GITHUB_OUTPUT

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: linuxcnc-${{ steps.meta.outputs.dist }}-${{ steps.meta.outputs.arch }}
        path: artifacts/${{ steps.meta.outputs.dist }}/${{ steps.meta.outputs.arch }}
        if-no-files-found: error


  package-indep:
    runs-on: ubuntu-24.04
    if: >-
      github.event_name == 'release' ||
      startsWith(github.ref, 'refs/tags/') ||
      github.event_name == 'workflow_dispatch'
    strategy:
      matrix:
        image: ["debian:bullseye", "debian:bookworm", "debian:trixie", "debian:sid"]
    container:
      image: ${{ matrix.image }}
      # IPC_OWNER is needed for shmget IPC_CREAT
      # SYS_ADMIN is needed for shmctl IPC_SET
      options: --cpus=2 --cap-add=IPC_OWNER --cap-add=SYS_ADMIN
    steps:
    - name: Dump GitHub context
      env:
        GITHUB_CONTEXT: ${{ toJson(github) }}
      run: echo "$GITHUB_CONTEXT"

    - name: Install pre-dependencies
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        set -e
        set -x
        apt-get --quiet update
        apt-get --yes --quiet install eatmydata curl
        eatmydata apt --quiet --yes upgrade
        # Install stuff needed to check out the linuxcnc repo and turn it into a debian source package.
        eatmydata apt-get --yes --quiet install --no-install-suggests git lsb-release python3 devscripts

    - uses: actions/checkout@v3
      with:
        # "fetch-depth: 0" fetches all of history, this is needed by
        # our build system to determine the version from tags
        fetch-depth: 0

    - name: Add linuxcnc.org deb archive
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        case "${{matrix.image}}" in
            debian:sid|debian:bookworm|debian:trixie)
                exit 0
                ;;
            *)
                ;;
        esac
        set -e
        set -x
        eatmydata apt-get --yes --quiet install gpg software-properties-common
        eatmydata gpg --homedir="${PWD}/gnupg" --output /etc/apt/trusted.gpg.d/linuxcnc-deb-archive.gpg --export 3CB9FD148F374FEF
        DIST=$(echo ${{matrix.image}} | cut -d : -f 2)
        eatmydata add-apt-repository "deb http://linuxcnc.org $DIST base"
        eatmydata apt-get --quiet update

    - name: Build architecture-independent Debian packages
      env:
        DEBEMAIL: emc-developers@lists.sourceforge.net
        DEBFULLNAME: LinuxCNC Github CI Robot
        DEBIAN_FRONTEND: noninteractive
      run: |
        set -e
        set -x
        eatmydata git config --global --add safe.directory "${PWD}"
        eatmydata debian/configure
        eatmydata debian/update-dch-from-git
        eatmydata scripts/get-version-from-git | sed -re 's/^v(.*)$/\1/' >| VERSION; cat VERSION
        eatmydata git diff
        eatmydata apt-get --yes --quiet build-dep --indep-only .
        eatmydata debuild -us -uc --build=all
    - name: Test install debian packages
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        set -e
        set -x
        eatmydata apt-get --yes --quiet install ../*.deb
    - name: Gather build artifacts
      run: |
        set -e
        set -x
        DIST=$(echo ${{ matrix.image }} | cut -d : -f 2)
        ARCH=all
        OUTDIR="artifacts/${DIST}/${ARCH}"
        mkdir -p "$OUTDIR"
        cp -v ../*.deb ../*.changes ../*.buildinfo "$OUTDIR" || true
        (cd "$OUTDIR" && sha256sum * > SHA256SUMS.txt)
        echo "DIST=$DIST" >> "$GITHUB_ENV"
        echo "ARCH=$ARCH" >> "$GITHUB_ENV"
    - name: Compute artifact metadata
      id: meta
      run: |
        echo "dist=$(echo ${{ matrix.image }} | cut -d : -f 2)" >> $GITHUB_OUTPUT
        echo "arch=all" >> $GITHUB_OUTPUT

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: linuxcnc-${{ steps.meta.outputs.dist }}-${{ steps.meta.outputs.arch }}
        path: artifacts/${{ steps.meta.outputs.dist }}/${{ steps.meta.outputs.arch }}
        if-no-files-found: error


  release:
    name: Release packages
    needs:
      - package-arch
      - package-indep
    if: (github.event_name == 'release' && github.event.action == 'published') || startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
    - name: Download artifacts
      uses: actions/download-artifact@v4
      with:
        path: release_artifacts
    - name: Prepare upload assets
      run: |
        set -e
        mkdir -p upload
        echo "Downloaded artifacts layout:" && find release_artifacts -maxdepth 3 -print | sed 's/^/  /'
        for d in release_artifacts/*; do
          [ -d "$d" ] || continue
          name=$(basename "$d")
          # Expect name like linuxcnc-bookworm-amd64 or linuxcnc-trixie-all
          dist=${name#linuxcnc-}
          dist=${dist%-*}
          arch=${name##*-}
          echo "Processing artifact: $name (dist=$dist arch=$arch)"
          # Copy .deb files with distro suffix (arch is already in Debian filename)
          for f in "$d"/*.deb; do
            [ -f "$f" ] || continue
            base=$(basename "$f")
            base_no_ext="${base%.deb}"
            dest="upload/${base_no_ext}_${dist}.deb"
            echo "  + $base -> $(basename "$dest")"
            cp "$f" "$dest"
          done
        done

        echo "Upload dir contents:" && ls -l upload | sed 's/^/  /'
        # Single combined checksums file for all assets, deterministic order
        if ls upload/*.deb >/dev/null 2>&1; then
          (
            cd upload
            : > SHA256SUMS.txt
            # sort file list for stable output
            for f in $(ls -1 *.deb | LC_ALL=C sort); do
              sha256sum "$f" >> SHA256SUMS.txt
            done
            echo "Preview of SHA256SUMS.txt:" && sed -n '1,200p' SHA256SUMS.txt | sed 's/^/  /'
          )
        fi
    - name: Create GitHub Release and upload assets
      uses: softprops/action-gh-release@v2
      with:
        files: |
          upload/*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
