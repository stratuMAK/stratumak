# vim: sw=2

name: Build CI

on:
  push:
    # Unfiltered push + pull_request would run everything twice for every PR
    # branch push. Branch work is covered by the pull_request trigger.
    branches: [main]
    tags: ['*']
  pull_request:
  release:
    types: [published]
  check_suite:
    types: [rerequested]
  # Manual trigger for the gated heavy jobs (packages, docs) without a release.
  workflow_dispatch:

# Job gating policy for this fork (upstream runs everything on every push):
#   - stmak + rip-and-test + static-checks: every push and PR — the merge gates.
#   - rip-and-test-clang, htmldocs: post-merge pushes to main only.
#   - package-gate: post-merge pushes to main + dispatch — builds the deb,
#     asserts package contents, requires lintian-clean, installs the result
#     and boots a config. This is the job that catches install-layout rot:
#     runtests exercises the RIP tree, where the layout differs.
#   - package-*: releases/tags (feeds the release job) or manual dispatch.

permissions:
  contents: read #  to fetch code (actions/checkout)

jobs:

  rip-and-test:
    runs-on: ubuntu-24.04
    steps:
    - name: Dump GitHub context
      env:
        GITHUB_CONTEXT: ${{ toJson(github) }}
      run: echo "$GITHUB_CONTEXT"
    - uses: actions/checkout@v2
      with:
        submodules: true
        fetch-depth: 0
    - run: git fetch --recurse-submodules=no https://github.com/linuxcnc/linuxcnc +refs/tags/*:refs/tags/*
    # Pin the Go toolchain: the apt go on the runner is older than go.mod
    # requires, so without this every fresh run downloads a toolchain from
    # golang.org mid-build — a recurring network-flake surface.
    - uses: actions/setup-go@v5
      with:
        go-version: '1.24.x'
        cache: false
    # COVERAGE=1 instruments this build so the suite below reports what it
    # reaches. It rides the run that was happening anyway rather than adding a
    # second one. The flag is a make variable with no default (see the block in
    # src/Makefile), and the package jobs build from clean sources without it,
    # so nothing instrumented can reach a shipped artifact.
    #
    # rip-and-test-clang runs this same suite uninstrumented on every push to
    # main, so an uninstrumented full-suite run still exists, at no extra cost.
    - name: Build RIP & test
      env:
        GOCOVERDIR: ${{ github.workspace }}/coverage/gocov
      run: |
        set -x
        sudo apt-get install -y eatmydata
        eatmydata ./scripts/travis-install-build-deps.sh
        eatmydata sudo apt-get install -y lcov
        mkdir -p "$GOCOVERDIR"
        cd src
        eatmydata ./autogen.sh
        eatmydata ./configure --with-realtime=uspace --disable-check-runtime-deps
        eatmydata make COVERAGE=1 -O -j$((1+$(nproc))) default pycheck V=1
        # Note that the package build covers html docs
        eatmydata ../scripts/rip-environment runtests -p
    - name: Collect coverage
      # Coverage is reporting, not a gate: a failure here must not turn a green
      # suite red. The suite's own result is the pass/fail signal.
      if: always()
      continue-on-error: true
      env:
        GOCOVERDIR: ${{ github.workspace }}/coverage/gocov
      run: ./scripts/collect-coverage
    - name: Upload coverage to Codecov
      if: always()
      continue-on-error: true
      uses: codecov/codecov-action@v5
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: ./coverage/c.info,./coverage/go.txt
        flags: runtests
        name: rip-and-test
        # disable_search: only the two reports collect-coverage produced should
        # be uploaded. Left on, the action also sweeps the tree and finds the
        # raw .gcov/.info leftovers, double-counting them under a second name.
        disable_search: true
        fail_ci_if_error: false
    - name: Upload failure logs
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: runtests-failure-logs
        path: |
          tests/**/server.log
          tests/**/result
          tests/**/stderr
          tests/**/out.motion-logger
        if-no-files-found: ignore

  rip-and-test-clang:
    runs-on: ubuntu-24.04
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
    - name: Dump GitHub context
      env:
        GITHUB_CONTEXT: ${{ toJson(github) }}
      run: echo "$GITHUB_CONTEXT"
    - uses: actions/checkout@v2
      with:
        submodules: true
        fetch-depth: 0
    - run: git fetch --recurse-submodules=no https://github.com/linuxcnc/linuxcnc +refs/tags/*:refs/tags/*
    # The RT function-effects check downloads a pinned clang (see
    # scripts/rt-clang.sh) — cache it so post-merge runs don't re-download.
    - name: Cache pinned RT-check clang
      uses: actions/cache@v4
      with:
        path: ~/.cache/stratumak-rt-clang
        key: rt-clang-22.1.8-${{ runner.arch }}
    # Pin the Go toolchain: the apt go on the runner is older than go.mod
    # requires, so without this every fresh run downloads a toolchain from
    # golang.org mid-build — a recurring network-flake surface.
    - uses: actions/setup-go@v5
      with:
        go-version: '1.24.x'
        cache: false
    - name: Clang build RIP & test
      run: |
        set -x
        sudo apt-get install -y eatmydata
        eatmydata ./scripts/travis-install-build-deps.sh
        sudo eatmydata apt-get install -y clang
        cd src
        eatmydata ./autogen.sh
        CC=clang CXX=clang++ eatmydata ./configure --with-realtime=uspace --disable-check-runtime-deps
        eatmydata make -O -j$((1+$(nproc))) default pycheck V=1
        # RT path verification: clang function-effects analysis over the
        # RTAPI/HAL core and every generated component (warnings = errors).
        eatmydata make rt-effects-check
        # Note that the package build covers html docs
        eatmydata ../scripts/rip-environment runtests -p

  # stmak gate: build + Go vet/tests + pinned lint (no NEW findings vs the
  # stmak merge base) + fmt + C-warning gate on stmak-owned paths. The make
  # targets are the source of truth (src/stmak/Submakefile); this job only
  # orchestrates them. The full runtests suite runs once per PR, in
  # rip-and-test (which uploads the failure logs).
  stmak:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@v2
      with:
        submodules: true
        fetch-depth: 0
    - run: git fetch --recurse-submodules=no https://github.com/linuxcnc/linuxcnc +refs/tags/*:refs/tags/*
    - uses: actions/setup-go@v5
      with:
        go-version: '1.24.x'
        # go.sum is build-generated (not in the repo), so setup-go's automatic
        # cache keying cannot work; the module cache is small enough to skip.
        cache: false
    - uses: actions/setup-node@v4
      with:
        node-version: '20'
    - name: Install golangci-lint (pinned — keep in sync with GOLANGCI_LINT_VERSION in src/stmak/Submakefile)
      run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2
    - name: Build RIP
      run: |
        set -x
        sudo apt-get install -y eatmydata
        eatmydata ./scripts/travis-install-build-deps.sh
        cd src
        eatmydata ./autogen.sh
        eatmydata ./configure --with-realtime=uspace --disable-check-runtime-deps
        eatmydata make -O -j$((1+$(nproc))) default V=1 2>&1 | tee ../build.log
        test "${PIPESTATUS[0]}" -eq 0
    - name: C warning gate (stmak-owned paths)
      run: ./scripts/check-stmak-cwarnings build.log
    - name: Go tests + lint + fmt gate
      run: |
        export PATH="$PATH:$HOME/go/bin"
        cd src
        make stmak-check STMAK_LINT_BASE=origin/main
    # Webapp gate: ESLint + cold vue-tsc type-check + vitest over the
    # non-deferred apps. Runs HERE, after the build, because the webapps' REST
    # clients (webapp/*/src/generated/*.ts) are gitignored artifacts that the
    # `make default` above generates via modcompile — a standalone job would
    # type-check against code that does not exist on a clean checkout.
    - name: Webapp gate (lint + type-check + tests)
      run: ./scripts/check-webapps.sh
    - name: Upload failure logs
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: stmak-failure-logs
        path: build.log
        if-no-files-found: ignore

  # Scoped, enforcing static analysis (shellcheck over fork-owned shell,
  # cppcheck over stmak-owned C). Needs no RIP build — fast fail on every PR.
  static-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v2
      with:
        submodules: true
    - name: Install analyzers
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends cppcheck shellcheck
    - name: Static checks (stmak-owned shell + C)
      run: ./scripts/check-static

  htmldocs:
    runs-on: ubuntu-24.04
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      github.event_name == 'release' ||
      github.event_name == 'workflow_dispatch'
    steps:
    - name: Dump GitHub context
      env:
        GITHUB_CONTEXT: ${{ toJson(github) }}
      run: echo "$GITHUB_CONTEXT"
    - uses: actions/checkout@v2
      with:
        submodules: true
        fetch-depth: 0
    - run: git fetch --recurse-submodules=no https://github.com/linuxcnc/linuxcnc +refs/tags/*:refs/tags/*
    # Pin the Go toolchain: the apt go on the runner is older than go.mod
    # requires, so without this every fresh run downloads a toolchain from
    # golang.org mid-build — a recurring network-flake surface.
    - uses: actions/setup-go@v5
      with:
        go-version: '1.24.x'
        cache: false
    - name: Build HTML docmentation
      run: |
        ./scripts/travis-install-build-deps.sh
        sudo apt-get install -y eatmydata
        cd src
        eatmydata ./autogen.sh
        eatmydata ./configure --with-realtime=uspace --disable-check-runtime-deps --enable-build-documentation=html
        eatmydata make -O -j$((1+$(nproc))) manpages
        eatmydata make -O -j$((1+$(nproc))) translateddocs
        eatmydata make -O -j$((1+$(nproc))) docs
        # Note that the package build covers html docs

  package-gate:
    runs-on: ubuntu-24.04
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      github.event_name == 'workflow_dispatch'
    container:
      image: debian:trixie
      # IPC_OWNER for shm during the boot smoke; SETFCAP so the postinst can
      # apply the realtime file capabilities. The remaining cap-adds mirror
      # STMAK_CAPS in stratumak.postinst exactly: execve of a binary carrying
      # file capabilities fails with EPERM unless every one of them is in the
      # container's bounding set, so without these nobody can even run the
      # installed stmakd.
      options: >-
        --cpus=2 --cap-add=IPC_OWNER --cap-add=SETFCAP
        --cap-add=NET_ADMIN --cap-add=NET_RAW --cap-add=BPF
        --cap-add=IPC_LOCK --cap-add=SYS_RESOURCE --cap-add=SYS_NICE
        --cap-add=SYS_RAWIO --cap-add=PERFMON --cap-add=SYS_ADMIN
        --cap-add=DAC_OVERRIDE
    steps:
    - name: Install pre-dependencies
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        set -e
        set -x
        apt-get --quiet update
        apt-get --yes --quiet install eatmydata
        eatmydata apt-get --yes --quiet install --no-install-suggests \
            git lsb-release python3 devscripts lintian
    - uses: actions/checkout@v3
      with:
        fetch-depth: 0
    - name: Build Debian packages
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        set -e
        set -x
        eatmydata git config --global --add safe.directory "${PWD}"
        eatmydata git submodule update --init
        eatmydata debian/configure
        eatmydata apt-get --yes --quiet build-dep .
        eatmydata bash scripts/package-gate.sh build
    - name: Gate stages (contents, lintian, install, smoke, extcomp)
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        set -e
        bash scripts/package-gate.sh contents lintian install smoke extcomp

  package-arch:
    runs-on: ${{ matrix.runner }}
    if: >-
      github.event_name == 'release' ||
      startsWith(github.ref, 'refs/tags/') ||
      github.event_name == 'workflow_dispatch'
    # sid is a canary, not a release target, and it never gates (see the image
    # matrix below for when it runs at all).
    continue-on-error: ${{ matrix.image == 'debian:sid' }}
    strategy:
      # One combination failing must not cancel the others: the whole point of
      # the matrix is to tell "broken everywhere" from "broken on this arch" or
      # "broken on this suite", and a cancelled sibling answers neither.
      fail-fast: false
      matrix:
        runner: ["ubuntu-24.04", "ubuntu-24.04-arm"]
        # Releases and tags build trixie only; a manual dispatch adds sid.
        #
        # sid exists to show us a toolchain change before it reaches a release
        # suite, and it has earned that twice: python3-poppler-qt5 is gone from
        # sid (five qtvcp screens import qt_pdf, so the package is currently
        # uninstallable there) and texlive 2026's babel-french dropped the
        # CompactItemize key dblatex still passes, which kills the French PDFs.
        # Neither is fixable here. Left in every run it would be permanently
        # red — and a job that is always red is one nobody reads, which is how
        # the next, real breakage gets missed. It is also the most expensive
        # thing in this workflow (a full test suite per architecture) for a
        # package that cannot currently be installed. So: ask for it when you
        # want to know, rather than being told daily what you already know.
        image: ${{ fromJSON(github.event_name == 'workflow_dispatch' && '["debian:trixie","debian:sid"]' || '["debian:trixie"]') }}
    container:
      image: ${{ matrix.image }}
      # IPC_OWNER for shmget IPC_CREAT, SYS_ADMIN for shmctl IPC_SET, SETFCAP so
      # the postinst can apply the realtime file capabilities. The rest mirror
      # STMAK_CAPS in stratumak.postinst exactly, and are needed to *run* the
      # result at all: execve of a binary carrying file capabilities fails with
      # EPERM unless every one of them is in the container's bounding set —
      # without them every test that starts a server dies on
      # "/usr/bin/stmakd: Operation not permitted". Same list as
      # package-gate; keep the two in step.
      options: >-
        --cpus=2 --cap-add=IPC_OWNER --cap-add=SETFCAP
        --cap-add=NET_ADMIN --cap-add=NET_RAW --cap-add=BPF
        --cap-add=IPC_LOCK --cap-add=SYS_RESOURCE --cap-add=SYS_NICE
        --cap-add=SYS_RAWIO --cap-add=PERFMON --cap-add=SYS_ADMIN
        --cap-add=DAC_OVERRIDE
    steps:
    - name: Dump GitHub context
      env:
        GITHUB_CONTEXT: ${{ toJson(github) }}
      run: echo "$GITHUB_CONTEXT"
    - name: Install pre-dependencies
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        set -e
        set -x
        apt-get --quiet update
        apt-get --yes --quiet install eatmydata curl
        eatmydata apt --quiet --yes upgrade
        # Install stuff needed to check out the linuxcnc repo and turn it into a debian source package.
        eatmydata apt-get --yes --quiet install --no-install-suggests git lsb-release python3 devscripts

    - uses: actions/checkout@v3
      with:
        # "fetch-depth: 0" fetches all of history, this is needed by
        # our build system to determine the version from tags
        fetch-depth: 0

    - name: Build architecture-specific Debian packages
      env:
        DEBEMAIL: emc-developers@lists.sourceforge.net
        DEBFULLNAME: LinuxCNC Github CI Robot
        DEBIAN_FRONTEND: noninteractive
      run: |
        set -e
        set -x
        eatmydata git config --global --add safe.directory "${PWD}"
        eatmydata git submodule update --init
        eatmydata debian/configure
        eatmydata debian/update-dch-from-git
        eatmydata git diff
        eatmydata apt-get --yes --quiet build-dep --arch-only .
        eatmydata debuild -us -uc --build=any
    # Install the packages and boot the result, on both architectures.
    #
    # This used to run the whole runtests suite here, inherited from upstream,
    # where the tests drove installed binaries. It cannot work on main and it
    # never did: the suite is a run-in-place suite. 18 of its tests load test
    # fixtures that live in the RIP tree's cmod directory and that a package
    # must not ship (test_spindle_remap, mcode_coord_log, test_interp_ext, …),
    # and 6 more call halrun, a RIP-only compatibility shim over
    # `stmakd -f`. Those 24 can never pass against an installed tree, so
    # the step could only ever be red — and the two failures that were real
    # (headers referencing headers we did not ship) it reported in the same
    # breath as the 24 that were not. rip-and-test runs the suite where it
    # belongs; package-gate asserts package contents and lintian.
    #
    # What is worth testing here is the thing this job alone produces: does the
    # package install on this architecture, and does the machine come up. That
    # is debian/tests/stmak-test, the same smoke package-gate runs on amd64,
    # so arm64 gets the same coverage for a few seconds instead of an hour.
    - name: Test debian packages
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        set -e
        set -x
        # The same stages package-gate runs, from the same script, so the two
        # cannot drift: install the built debs, then drop root and boot.
        bash scripts/package-gate.sh install smoke
    - name: Gather build artifacts
      run: |
        set -e
        set -x
        ARCH=$(dpkg --print-architecture)
        DIST=$(echo ${{ matrix.image }} | cut -d : -f 2)
        OUTDIR="artifacts/${DIST}/${ARCH}"
        mkdir -p "$OUTDIR"
        cp -v ../*.deb ../*.changes ../*.buildinfo "$OUTDIR" || true
        (cd "$OUTDIR" && sha256sum * > SHA256SUMS.txt)
        echo "DIST=$DIST" >> "$GITHUB_ENV"
        echo "ARCH=$ARCH" >> "$GITHUB_ENV"
    - name: Compute artifact metadata
      id: meta
      run: |
        echo "dist=$(echo ${{ matrix.image }} | cut -d : -f 2)" >> $GITHUB_OUTPUT
        echo "arch=$(dpkg --print-architecture)" >> $GITHUB_OUTPUT

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: stratumak-${{ steps.meta.outputs.dist }}-${{ steps.meta.outputs.arch }}
        path: artifacts/${{ steps.meta.outputs.dist }}/${{ steps.meta.outputs.arch }}
        if-no-files-found: error


  package-indep:
    runs-on: ubuntu-24.04
    if: >-
      github.event_name == 'release' ||
      startsWith(github.ref, 'refs/tags/') ||
      github.event_name == 'workflow_dispatch'
    # See package-arch: sid does not gate, and only runs on a manual dispatch.
    # This is the job the French-PDF breakage lands in, since the doc packages
    # are the arch-independent ones.
    continue-on-error: ${{ matrix.image == 'debian:sid' }}
    strategy:
      # See package-arch: a cancelled sibling cannot tell us whether a failure
      # is the suite's fault or ours.
      fail-fast: false
      matrix:
        image: ${{ fromJSON(github.event_name == 'workflow_dispatch' && '["debian:trixie","debian:sid"]' || '["debian:trixie"]') }}
    container:
      image: ${{ matrix.image }}
      # IPC_OWNER is needed for shmget IPC_CREAT
      # SYS_ADMIN is needed for shmctl IPC_SET
      options: --cpus=2 --cap-add=IPC_OWNER --cap-add=SYS_ADMIN
    steps:
    - name: Dump GitHub context
      env:
        GITHUB_CONTEXT: ${{ toJson(github) }}
      run: echo "$GITHUB_CONTEXT"

    - name: Install pre-dependencies
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        set -e
        set -x
        apt-get --quiet update
        apt-get --yes --quiet install eatmydata curl
        eatmydata apt --quiet --yes upgrade
        # Install stuff needed to check out the linuxcnc repo and turn it into a debian source package.
        eatmydata apt-get --yes --quiet install --no-install-suggests git lsb-release python3 devscripts

    - uses: actions/checkout@v3
      with:
        # "fetch-depth: 0" fetches all of history, this is needed by
        # our build system to determine the version from tags
        fetch-depth: 0

    - name: Build architecture-independent Debian packages
      env:
        DEBEMAIL: emc-developers@lists.sourceforge.net
        DEBFULLNAME: LinuxCNC Github CI Robot
        DEBIAN_FRONTEND: noninteractive
      run: |
        set -e
        set -x
        eatmydata git config --global --add safe.directory "${PWD}"
        eatmydata git submodule update --init
        eatmydata debian/configure
        eatmydata debian/update-dch-from-git
        eatmydata git diff
        eatmydata apt-get --yes --quiet build-dep --indep-only .
        eatmydata debuild -us -uc --build=all
    - name: Test install debian packages
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        set -e
        set -x
        eatmydata apt-get --yes --quiet install ../*.deb
    - name: Gather build artifacts
      run: |
        set -e
        set -x
        DIST=$(echo ${{ matrix.image }} | cut -d : -f 2)
        ARCH=all
        OUTDIR="artifacts/${DIST}/${ARCH}"
        mkdir -p "$OUTDIR"
        cp -v ../*.deb ../*.changes ../*.buildinfo "$OUTDIR" || true
        (cd "$OUTDIR" && sha256sum * > SHA256SUMS.txt)
        echo "DIST=$DIST" >> "$GITHUB_ENV"
        echo "ARCH=$ARCH" >> "$GITHUB_ENV"
    - name: Compute artifact metadata
      id: meta
      run: |
        echo "dist=$(echo ${{ matrix.image }} | cut -d : -f 2)" >> $GITHUB_OUTPUT
        echo "arch=all" >> $GITHUB_OUTPUT

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: stratumak-${{ steps.meta.outputs.dist }}-${{ steps.meta.outputs.arch }}
        path: artifacts/${{ steps.meta.outputs.dist }}/${{ steps.meta.outputs.arch }}
        if-no-files-found: error


  release:
    name: Release packages
    needs:
      - package-arch
      - package-indep
    if: (github.event_name == 'release' && github.event.action == 'published') || startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
    - name: Download artifacts
      uses: actions/download-artifact@v4
      with:
        path: release_artifacts
    - name: Prepare upload assets
      run: |
        set -e
        mkdir -p upload
        echo "Downloaded artifacts layout:" && find release_artifacts -maxdepth 3 -print | sed 's/^/  /'
        for d in release_artifacts/*; do
          [ -d "$d" ] || continue
          name=$(basename "$d")
          # Expect name like stratumak-bookworm-amd64 or stratumak-trixie-all.
          # Fail loudly on anything else: ${name#prefix} leaves the name intact
          # when the prefix does not match, which would silently publish
          # "..._stratumak.deb" instead of "..._bookworm.deb".
          case "$name" in
            stratumak-*) ;;
            *) echo "unexpected artifact name: $name (expected stratumak-<dist>-<arch>)" >&2; exit 1 ;;
          esac
          dist=${name#stratumak-}
          dist=${dist%-*}
          arch=${name##*-}
          echo "Processing artifact: $name (dist=$dist arch=$arch)"
          # Copy .deb files with distro suffix (arch is already in Debian filename)
          for f in "$d"/*.deb; do
            [ -f "$f" ] || continue
            base=$(basename "$f")
            base_no_ext="${base%.deb}"
            dest="upload/${base_no_ext}_${dist}.deb"
            echo "  + $base -> $(basename "$dest")"
            cp "$f" "$dest"
          done
        done

        echo "Upload dir contents:" && ls -l upload | sed 's/^/  /'
        # Single combined checksums file for all assets, deterministic order
        if ls upload/*.deb >/dev/null 2>&1; then
          (
            cd upload
            : > SHA256SUMS.txt
            # sort file list for stable output
            for f in $(ls -1 *.deb | LC_ALL=C sort); do
              sha256sum "$f" >> SHA256SUMS.txt
            done
            echo "Preview of SHA256SUMS.txt:" && sed -n '1,200p' SHA256SUMS.txt | sed 's/^/  /'
          )
        fi
    - name: Create GitHub Release and upload assets
      uses: softprops/action-gh-release@v2
      with:
        files: |
          upload/*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
