[EMC]
VERSION = 1.1
DEBUG = 0x0

[DISPLAY]
DISPLAY = ./test-ui.py

[RS274NGC]
PARAMETER_FILE = sim.var

[EMCMOT]
EMCMOT = motmod
COMM_TIMEOUT = 4.0
BASE_PERIOD = 0
SERVO_PERIOD = 1000000

[TASK]
TASK = milltask
CYCLE_TIME = 0.001

[HAL]
# linuxcnc.hal loads the CNC stack; [JOINT_0]HOMEMOD selects homemod_cia402.
HALFILE = LIB:linuxcnc.hal
HALFILE = LIB:threads.hal
# kins + motmod + the simulated CiA 402 drive, wired to the joint + homemod.
HALFILE = cia402-early-sim.hal

[TRAJ]
# Allow STATE_ON without homing first; the test homes explicitly.
NO_FORCE_HOMING = 1
COORDINATES = X
LINEAR_UNITS = mm
ANGULAR_UNITS = degree
DEFAULT_LINEAR_VELOCITY = 50
MAX_LINEAR_VELOCITY = 100

[EMCIO]
EMCIO = io
CYCLE_TIME = 0.100

[KINS]
KINEMATICS = trivkins coordinates=X
JOINTS = 1

[AXIS_X]
MIN_LIMIT = -100.0
MAX_LIMIT = 100.0
MAX_VELOCITY = 100
MAX_ACCELERATION = 1000.0

[JOINT_0]
# Drive-internal homing via the CiA 402 homing module, on a drive that raises
# HomingAttained BEFORE it has finished travelling to its new origin (the
# LinMot does: the flag comes mid-retract, ~0.4 mm short).  HOME_OFFSET says
# where the drive's origin sits in joint coordinates, and that has to hold
# whether or not the slider was on the origin when the flag came.
HOMEMOD = homemod_cia402
TYPE = LINEAR
HOME = 0.0
HOME_OFFSET = -0.5
HOME_SEQUENCE = 0
HOME_SEARCH_VEL = 5.0
HOME_LATCH_VEL = 1.0
MAX_VELOCITY = 100
MAX_ACCELERATION = 1000.0
BACKLASH = 0.000
MIN_LIMIT = -100.0
MAX_LIMIT = 100.0
FERROR = 5.0
MIN_FERROR = 0.5
