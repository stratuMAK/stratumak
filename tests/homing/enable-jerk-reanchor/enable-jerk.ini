[EMC]
VERSION = 1.1
DEBUG = 0x0

[DISPLAY]
DISPLAY = ./test-ui.py

[RS274NGC]
PARAMETER_FILE = sim.var

[EMCMOT]
EMCMOT = motmod
COMM_TIMEOUT = 4.0
BASE_PERIOD = 0
SERVO_PERIOD = 1000000

[TASK]
TASK = milltask
CYCLE_TIME = 0.001

[HAL]
# linuxcnc.hal loads the CNC stack; threads.hal creates servo-thread.
HALFILE = LIB:linuxcnc.hal
HALFILE = LIB:threads.hal
# kins + motmod + feedback mux ("axis pushed while off") + step watchdog.
HALFILE = enable-jerk-sim.hal

[TRAJ]
# The test never homes; it exercises the disable->enable transition.
NO_FORCE_HOMING = 1
COORDINATES = X
LINEAR_UNITS = mm
ANGULAR_UNITS = degree
DEFAULT_LINEAR_VELOCITY = 5
MAX_LINEAR_VELOCITY = 10

[EMCIO]
EMCIO = io
CYCLE_TIME = 0.100

[KINS]
KINEMATICS = trivkins coordinates=X
JOINTS = 1

[AXIS_X]
MIN_LIMIT = -100.0
MAX_LIMIT = 100.0
MAX_VELOCITY = 10
MAX_ACCELERATION = 30.0

[JOINT_0]
TYPE = LINEAR
HOME = 0.0
HOME_SEQUENCE = 0
HOME_SEARCH_VEL = 0.0
HOME_LATCH_VEL = 0.0
MAX_VELOCITY = 10
MAX_ACCELERATION = 30.0
# Same filter window as the switch-homing sibling: acc/(jerk*period) = 30
# cycles. The bug this test pins needs the filter enabled.
MAX_JERK = 1000.0
BACKLASH = 0.000
FERROR = 5.0
MIN_FERROR = 0.5
MIN_LIMIT = -100.0
MAX_LIMIT = 100.0
