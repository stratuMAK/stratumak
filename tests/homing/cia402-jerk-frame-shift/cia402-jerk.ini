[EMC]
VERSION = 1.1
DEBUG = 0x0

[DISPLAY]
DISPLAY = ./test-ui.py

[RS274NGC]
PARAMETER_FILE = sim.var

[EMCMOT]
EMCMOT = motmod
COMM_TIMEOUT = 4.0
BASE_PERIOD = 0
SERVO_PERIOD = 1000000

[TASK]
TASK = milltask
CYCLE_TIME = 0.001

[HAL]
# linuxcnc.hal loads the CNC stack; [JOINT_0]HOMEMOD selects homemod_cia402.
HALFILE = LIB:linuxcnc.hal
HALFILE = LIB:threads.hal
# kins + motmod + the simulated CiA 402 drive + motor-cmd step watchdog.
HALFILE = cia402-jerk-sim.hal

[TRAJ]
# Allow STATE_ON without homing first; the test homes explicitly.
NO_FORCE_HOMING = 1
COORDINATES = X
LINEAR_UNITS = mm
ANGULAR_UNITS = degree
DEFAULT_LINEAR_VELOCITY = 50
MAX_LINEAR_VELOCITY = 100

[EMCIO]
EMCIO = io
CYCLE_TIME = 0.100

[KINS]
KINEMATICS = trivkins coordinates=X
JOINTS = 1

[AXIS_X]
MIN_LIMIT = -100.0
MAX_LIMIT = 100.0
MAX_VELOCITY = 100
MAX_ACCELERATION = 1000.0

[JOINT_0]
# Drive-internal homing via the CiA 402 homing module — same setup as
# cia402-following-error, but with the jerk-limiting boxcar filter enabled:
# MAX_JERK gives window = acc/(jerk*period) = 31 cycles, longer than the sim
# drive's 5-cycle opmode handshake. At homing-attained the drive steps its
# origin by 5 mm and homemod resyncs pos_cmd/motor_offset; an unshifted
# filter history drains the old-frame command into the drive after it
# re-enters CSP — a physical ~4 mm excursion right after homing.
HOMEMOD = homemod_cia402
TYPE = LINEAR
HOME = 0.0
HOME_OFFSET = 0.0
HOME_SEQUENCE = 0
HOME_SEARCH_VEL = 5.0
HOME_LATCH_VEL = 1.0
MAX_VELOCITY = 100
MAX_ACCELERATION = 1000.0
MAX_JERK = 33000.0
BACKLASH = 0.000
MIN_LIMIT = -100.0
MAX_LIMIT = 100.0
FERROR = 5.0
MIN_FERROR = 0.5
