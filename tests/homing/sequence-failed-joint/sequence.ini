[EMC]
VERSION = 1.1
DEBUG = 0x0

[DISPLAY]
DISPLAY = ./test-ui.py

[RS274NGC]
PARAMETER_FILE = sim.var

[EMCMOT]
EMCMOT = motmod
COMM_TIMEOUT = 4.0
BASE_PERIOD = 0
SERVO_PERIOD = 1000000

[TASK]
TASK = milltask
CYCLE_TIME = 0.001

[HAL]
# linuxcnc.hal loads the CNC stack; [JOINT_n]HOMEMOD selects homemod_cia402.
HALFILE = LIB:linuxcnc.hal
HALFILE = LIB:threads.hal
# kins + motmod + two simulated CiA 402 drives, wired to the joints + homemods.
HALFILE = sequence-sim.hal

[TRAJ]
# Allow STATE_ON without homing first; the test homes explicitly.
NO_FORCE_HOMING = 1
COORDINATES = XY
LINEAR_UNITS = mm
ANGULAR_UNITS = degree
DEFAULT_LINEAR_VELOCITY = 50
MAX_LINEAR_VELOCITY = 100

[EMCIO]
EMCIO = io
CYCLE_TIME = 0.100

[KINS]
KINEMATICS = trivkins coordinates=XY
JOINTS = 2

[AXIS_X]
MIN_LIMIT = -100.0
MAX_LIMIT = 100.0
MAX_VELOCITY = 100
MAX_ACCELERATION = 1000.0

[AXIS_Y]
MIN_LIMIT = -100.0
MAX_LIMIT = 100.0
MAX_VELOCITY = 100
MAX_ACCELERATION = 1000.0

# The order is the point: joint 1 homes first, joint 0 only after it -- the
# axis that has to be out of the way before the other one travels.
[JOINT_0]
HOMEMOD = homemod_cia402
TYPE = LINEAR
HOME = 0.0
HOME_OFFSET = 0.0
HOME_SEQUENCE = 1
HOME_SEARCH_VEL = 5.0
HOME_LATCH_VEL = 1.0
MAX_VELOCITY = 100
MAX_ACCELERATION = 1000.0
BACKLASH = 0.000
MIN_LIMIT = -100.0
MAX_LIMIT = 100.0
FERROR = 5.0
MIN_FERROR = 0.5

[JOINT_1]
HOMEMOD = homemod_cia402
TYPE = LINEAR
HOME = 0.0
HOME_OFFSET = 0.0
HOME_SEQUENCE = 0
HOME_SEARCH_VEL = 5.0
HOME_LATCH_VEL = 1.0
MAX_VELOCITY = 100
MAX_ACCELERATION = 1000.0
BACKLASH = 0.000
MIN_LIMIT = -100.0
MAX_LIMIT = 100.0
FERROR = 5.0
MIN_FERROR = 0.5
