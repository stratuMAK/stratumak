# Home All on an already-homed machine must re-home every sequence, not just
# the first.  Three joints in three sequences is the minimum that shows it.
[EMC]
VERSION = 1.1
MACHINE = rehome-all-sequences
DEBUG = 0

[DISPLAY]
DISPLAY = none
CYCLE_TIME = 0.100

[TASK]
TASK = milltask
CYCLE_TIME = 0.010

[RS274NGC]
PARAMETER_FILE = rehome.var

[EMCMOT]
EMCMOT = motmod
COMM_TIMEOUT = 1.0
SERVO_PERIOD = 1000000

[HAL]
HALFILE = LIB:linuxcnc.hal
HALFILE = LIB:threads.hal
HALFILE = rehome-sim.hal

[TRAJ]
COORDINATES = XYZ
LINEAR_UNITS = mm
ANGULAR_UNITS = degree
DEFAULT_LINEAR_VELOCITY = 5
MAX_LINEAR_VELOCITY = 10

[EMCIO]
EMCIO = io
CYCLE_TIME = 0.100

[KINS]
KINEMATICS = trivkins coordinates=XYZ
JOINTS = 3

[AXIS_X]
MIN_LIMIT = -100.0
MAX_LIMIT = 100.0
MAX_VELOCITY = 10
MAX_ACCELERATION = 30.0

[AXIS_Y]
MIN_LIMIT = -100.0
MAX_LIMIT = 100.0
MAX_VELOCITY = 10
MAX_ACCELERATION = 30.0

[AXIS_Z]
MIN_LIMIT = -100.0
MAX_LIMIT = 100.0
MAX_VELOCITY = 10
MAX_ACCELERATION = 30.0

# Three distinct sequences, deliberately not in joint order: the machine that
# found this bug homes Z(0), A(1), C(2), X+Y(3), and the joint that re-homed
# was the one in sequence 0, not joint 0.
[JOINT_0]
TYPE = LINEAR
HOME = 0.0
HOME_SEQUENCE = 2
HOME_SEARCH_VEL = 0.0
HOME_LATCH_VEL = 0.0
MAX_VELOCITY = 10
MAX_ACCELERATION = 30.0
FERROR = 5.0
MIN_FERROR = 0.5
MIN_LIMIT = -100.0
MAX_LIMIT = 100.0

[JOINT_1]
TYPE = LINEAR
HOME = 0.0
HOME_SEQUENCE = 1
HOME_SEARCH_VEL = 0.0
HOME_LATCH_VEL = 0.0
MAX_VELOCITY = 10
MAX_ACCELERATION = 30.0
FERROR = 5.0
MIN_FERROR = 0.5
MIN_LIMIT = -100.0
MAX_LIMIT = 100.0

[JOINT_2]
TYPE = LINEAR
HOME = 0.0
HOME_SEQUENCE = 0
HOME_SEARCH_VEL = 0.0
HOME_LATCH_VEL = 0.0
MAX_VELOCITY = 10
MAX_ACCELERATION = 30.0
FERROR = 5.0
MIN_FERROR = 0.5
MIN_LIMIT = -100.0
MAX_LIMIT = 100.0
