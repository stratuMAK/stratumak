[EMC]
VERSION = 1.1
DEBUG = 0x0

[DISPLAY]
DISPLAY = ./test-ui.py

[RS274NGC]
PARAMETER_FILE = sim.var

[EMCMOT]
EMCMOT = motmod
COMM_TIMEOUT = 4.0
BASE_PERIOD = 0
SERVO_PERIOD = 1000000

[TASK]
TASK = milltask
CYCLE_TIME = 0.001

[HAL]
# linuxcnc.hal loads the CNC stack (default switch-type homemod for joint 0).
HALFILE = LIB:linuxcnc.hal
HALFILE = LIB:threads.hal
# kins + motmod + simulated home/limit switch + motor-cmd step watchdog.
HALFILE = switch-jerk-sim.hal

[TRAJ]
# Allow STATE_ON without homing first; the test homes explicitly.
NO_FORCE_HOMING = 1
COORDINATES = X
LINEAR_UNITS = mm
ANGULAR_UNITS = degree
DEFAULT_LINEAR_VELOCITY = 5
MAX_LINEAR_VELOCITY = 10

[EMCIO]
EMCIO = io
CYCLE_TIME = 0.100

[KINS]
KINEMATICS = trivkins coordinates=X
JOINTS = 1

[AXIS_X]
MIN_LIMIT = -100.0
MAX_LIMIT = 100.0
MAX_VELOCITY = 10
MAX_ACCELERATION = 30.0

[JOINT_0]
TYPE = LINEAR
# Switch homing with the home switch doubling as the positive limit switch
# (HOME_IGNORE_LIMITS), like a machine that homes onto its limit switch.
# The simulated switch sits at +8 mm while HOME_OFFSET is 2 mm, so the
# coarse-position frame shift at switch trip is a 6 mm redefinition — with
# MAX_JERK enabled (boxcar filter window = acc/(jerk*period) = 30 cycles)
# an unshifted filter history turns that into a physical 6 mm command step.
HOME = 0.0
HOME_OFFSET = 2.0
HOME_SEQUENCE = 0
HOME_SEARCH_VEL = 5.0
HOME_LATCH_VEL = -0.5
HOME_IGNORE_LIMITS = YES
MAX_VELOCITY = 10
MAX_ACCELERATION = 30.0
MAX_JERK = 1000.0
BACKLASH = 0.000
FERROR = 5.0
MIN_FERROR = 0.5
MIN_LIMIT = -100.0
MAX_LIMIT = 100.0
