[EMC]
VERSION = 1.1
MACHINE = task-ui-disable
DEBUG = 0

[DISPLAY]
DISPLAY = ./test-ui.py

[EMCMOT]
EMCMOT = motmod
COMM_TIMEOUT = 4.0
SERVO_PERIOD = 1000000

[TASK]
TASK = milltask
CYCLE_TIME = 0.010

[HAL]
HALFILE = LIB:linuxcnc.hal
HALFILE = LIB:threads.hal
HALFILE = task-ui-disable.hal

[TRAJ]
COORDINATES = X Y Z
LINEAR_UNITS = mm
ANGULAR_UNITS = degree
DEFAULT_LINEAR_VELOCITY = 2.0
MAX_LINEAR_VELOCITY = 10.0

[EMCIO]
EMCIO = io
CYCLE_TIME = 0.100

[KINS]
KINEMATICS = trivkins
JOINTS = 3

[AXIS_X]
MIN_LIMIT = -20.0
MAX_LIMIT = 20.0
MAX_VELOCITY = 10.0
MAX_ACCELERATION = 100.0

[AXIS_Y]
MIN_LIMIT = -20.0
MAX_LIMIT = 20.0
MAX_VELOCITY = 10.0
MAX_ACCELERATION = 100.0

[AXIS_Z]
MIN_LIMIT = -20.0
MAX_LIMIT = 20.0
MAX_VELOCITY = 10.0
MAX_ACCELERATION = 100.0

[JOINT_0]
TYPE = LINEAR
HOME = 0.0
HOME_OFFSET = 0.0
HOME_ABSOLUTE_ENCODER = 2
HOME_FINAL_VEL = 5.0
MAX_VELOCITY = 10.0
MAX_ACCELERATION = 100.0
FERROR = 1.0
MIN_FERROR = 0.5
MIN_LIMIT = -20.0
MAX_LIMIT = 20.0

[JOINT_1]
TYPE = LINEAR
HOME = 0.0
HOME_OFFSET = 5.0
HOME_FINAL_VEL = 5.0
MAX_VELOCITY = 10.0
MAX_ACCELERATION = 100.0
FERROR = 1.0
MIN_FERROR = 0.5
MIN_LIMIT = -20.0
MAX_LIMIT = 20.0

[JOINT_2]
TYPE = LINEAR
HOME = 0.0
HOME_OFFSET = 0.0
HOME_FINAL_VEL = 5.0
MAX_VELOCITY = 10.0
MAX_ACCELERATION = 100.0
FERROR = 1.0
MIN_FERROR = 0.5
MIN_LIMIT = -20.0
MAX_LIMIT = 20.0
