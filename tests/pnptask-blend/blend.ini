; Reproduce the coating cell's streamed approach with its own parameters.
;
; The drives only follow setpoints, so the commanded path is a pure function of
; the configuration and the order the segments are queued in — which makes the
; machine's behaviour reproducible here exactly. Every dynamic value below is
; the cell's: 2000 mm/s^2, CLEARANCE 5, BLEND_TOLERANCE 3, a 1 ms servo period
; and 500/3000 axis limits. The geometry is the cell's too, laid out so leg 1 is
; 125 mm and leg 2 is 115 mm as it is there.

[EMC]
VERSION = 1.1
MACHINE = pnptask-blend

[HAL]
HALFILE = LIB:threads.hal
HALFILE = blend.hal

[EMCMOT]
EMCMOT = pnp.mot
MOTION_INSTANCE = pnp.mot
SERVO_PERIOD = 1000000

[TRAJ]
COORDINATES = X Y Z
LINEAR_UNITS = mm
ANGULAR_UNITS = degree
DEFAULT_LINEAR_VELOCITY = 250
MAX_LINEAR_VELOCITY = 500
DEFAULT_LINEAR_ACCELERATION = 2000
MAX_LINEAR_ACCELERATION = 3000

[KINS]
KINEMATICS = trivkins
JOINTS = 3

[AXIS_X]
MAX_VELOCITY = 500
MAX_ACCELERATION = 3000
MIN_LIMIT = -800.0
MAX_LIMIT = 20.0

[AXIS_Y]
MAX_VELOCITY = 500
MAX_ACCELERATION = 3000
MIN_LIMIT = -20.0
MAX_LIMIT = 420.0

[AXIS_Z]
MAX_VELOCITY = 500
MAX_ACCELERATION = 3000
MIN_LIMIT = -100.0
MAX_LIMIT = 20.0

[JOINT_0]
TYPE = LINEAR
MAX_VELOCITY = 500
MAX_ACCELERATION = 3000
MIN_LIMIT = -800.0
MAX_LIMIT = 20.0
HOME = -725.0
HOME_SEQUENCE = 0
HOME_SEARCH_VEL = 0
HOME_LATCH_VEL = 0

[JOINT_1]
TYPE = LINEAR
MAX_VELOCITY = 500
MAX_ACCELERATION = 3000
MIN_LIMIT = -20.0
MAX_LIMIT = 420.0
HOME = 168.0
HOME_SEQUENCE = 0
HOME_SEARCH_VEL = 0
HOME_LATCH_VEL = 0

[JOINT_2]
TYPE = LINEAR
MAX_VELOCITY = 500
MAX_ACCELERATION = 3000
MIN_LIMIT = -100.0
MAX_LIMIT = 20.0
HOME = 0.0
HOME_SEQUENCE = 0
HOME_SEARCH_VEL = 0
HOME_LATCH_VEL = 0

[PNPTASK]
AUTOHOME = 1
MOVE_HEIGHT = -5.0
CLEARANCE = 5.0
BLEND_TOLERANCE = 3.0
POS_TOLERANCE = 0.1
MOVE_VEL = 50.0
MOVE_ACC = 2000.0
Z_VEL = 20.0
Z_ACC = 2000.0
BLEND_TAIL_MARGIN = 4
; The join between the two legs is declared tangent from measured geometry.
POS_SETTLE_TIME = 0.0
PICK_SETTLE_TIME = 0.05
RELEASE_TIME = 0.0
RELEASE_TIMEOUT = 5.0
HOME_TIMEOUT = 30.0
; 0 = sphere open (the station is reachable), 1 = sphere closed.
DEADZONE_FILE = zones-open.dxf
DEADZONE_FILE = zones-closed.dxf

; The travel starts here: one slot, where the head is parked at the start of a
; job, 125 mm from the wait point.
[PNPTASK_TRAYDEF_0]
ID = 1
ROWS = 1
COLS = 1
FIRST_X = -725.0
FIRST_Y = 168.0

[PNPTASK_TRAY_0]
ID = 10
Z_PICK = -50.0

; The enclosed station. Its approach is split at the enclosure boundary.
[PNPTASK_PROC_0]
ID = 20
X = -485.0
Y = 168.0
Z_PICK = -50.0
WAIT_DEADZONE = 1
WAIT_CLEAR_DEADZONE = 0
