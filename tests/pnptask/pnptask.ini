; pnptask simulation config — a pick-and-place machine with no G-code, no
; iocontrol and no UI: jobs are commanded over HAL pins alone.
;
; Machine: 600 x 500 mm XYZ gantry, one component tray, one output tray and two
; process stations. See README and docs/dev/PNPTASK_DESIGN.md.

[EMC]
VERSION = 1.1
MACHINE = pnptask-sim

[HAL]
; threads.hal creates servo-thread from [EMCMOT]SERVO_PERIOD and must come
; before any addf.
HALFILE = LIB:threads.hal
HALFILE = pnptask.hal

[EMCMOT]
EMCMOT = pnp.mot
; pnptask reads the motion instance from here (load-line motion_instance=
; would take precedence), the same fallback milltask supports.
MOTION_INSTANCE = pnp.mot
SERVO_PERIOD = 1000000

; ---------------------------------------------------------------------------
; Motion stack. pnptask is a peer of milltask: it owns this stack and drives it
; through motctl/motstat. No [EMCIO] and no [TASK] — there is no toolchanger and
; no interpreter.
; ---------------------------------------------------------------------------

[TRAJ]
COORDINATES = X Y Z
LINEAR_UNITS = mm
ANGULAR_UNITS = degree
DEFAULT_LINEAR_VELOCITY = 200
MAX_LINEAR_VELOCITY = 800
DEFAULT_LINEAR_ACCELERATION = 2000
MAX_LINEAR_ACCELERATION = 4000

[KINS]
KINEMATICS = trivkins
JOINTS = 3

[AXIS_X]
MAX_VELOCITY = 800
MAX_ACCELERATION = 4000
MIN_LIMIT = 0
MAX_LIMIT = 600

[AXIS_Y]
MAX_VELOCITY = 800
MAX_ACCELERATION = 4000
MIN_LIMIT = 0
MAX_LIMIT = 500

[AXIS_Z]
MAX_VELOCITY = 300
MAX_ACCELERATION = 3000
MIN_LIMIT = -5
MAX_LIMIT = 100

[JOINT_0]
TYPE = LINEAR
HOME = 0.0
MAX_VELOCITY = 800
MAX_ACCELERATION = 4000
MIN_LIMIT = 0
MAX_LIMIT = 600
FERROR = 1.0
MIN_FERROR = 0.25
HOME_SEARCH_VEL = 0
HOME_LATCH_VEL = 0
HOME_SEQUENCE = 0

[JOINT_1]
TYPE = LINEAR
HOME = 0.0
MAX_VELOCITY = 800
MAX_ACCELERATION = 4000
MIN_LIMIT = 0
MAX_LIMIT = 500
FERROR = 1.0
MIN_FERROR = 0.25
HOME_SEARCH_VEL = 0
HOME_LATCH_VEL = 0
HOME_SEQUENCE = 0

[JOINT_2]
TYPE = LINEAR
HOME = 100.0
MAX_VELOCITY = 300
MAX_ACCELERATION = 3000
MIN_LIMIT = -5
MAX_LIMIT = 100
FERROR = 1.0
MIN_FERROR = 0.25
HOME_SEARCH_VEL = 0
HOME_LATCH_VEL = 0
HOME_SEQUENCE = 0

; ---------------------------------------------------------------------------
; pnptask
; ---------------------------------------------------------------------------

[PNPTASK]
AUTOHOME = 1
MOVE_HEIGHT = 40.0
; CLEARANCE covers the true safety margin plus BLEND_TOLERANCE: the trajectory
; planner blends corners inward, toward the dead zone.
CLEARANCE = 12.0
BLEND_TOLERANCE = 2.0
; How far a computed position may sit from a taught one: a tray grid is built
; from its step widths and tilted onto its taught LAST (D24), and this is how
; much leftover is teaching noise rather than a wrong config.
POS_TOLERANCE = 0.1
MOVE_VEL = 600.0
MOVE_ACC = 3000.0
Z_VEL = 200.0
Z_ACC = 2000.0
POS_SETTLE_TIME = 0.05
PICK_SETTLE_TIME = 0.10
RELEASE_TIME = 0.10
RELEASE_TIMEOUT = 5.0
HOME_TIMEOUT = 30.0
; Line order is what deadzone-select indexes: 0 = zones.dxf, 1 = zones_alt.dxf.
DEADZONE_FILE = zones.dxf
DEADZONE_FILE = zones_alt.dxf

; Tray geometry. A tray station picks one of these at runtime with its tray-id
; pin; the coordinates are absolute machine coordinates (D17).
[PNPTASK_TRAYDEF_0]
ID = 1
ROWS = 4
COLS = 10
FIRST_X = 100.0
FIRST_Y = 380.0
; LAST is the *taught* far corner: it does not stretch the grid, it only says
; how the tray sits on the table (D24). The grid itself comes from the steps.
LAST_X = 280.0
LAST_Y = 440.0
COL_STEP = 20.0
ROW_STEP = 20.0
DIR_MODE = C+R+~
MAX_UNPOPULATED = 3

; A single-position tray: no LAST, so every pick and place happens at FIRST.
[PNPTASK_TRAYDEF_1]
ID = 2
ROWS = 1
COLS = 1
FIRST_X = 60.0
FIRST_Y = 60.0

; Tray stations. They have no X/Y of their own — only a pick height and pins.
[PNPTASK_TRAY_0]
ID = 10
Z_PICK = 2.5

[PNPTASK_TRAY_1]
ID = 11
Z_PICK = 2.0

; Process stations.
[PNPTASK_PROC_0]
ID = 20
X = 300.0
Y = 200.0
Z_PICK = 5.0
; While station 20 is busy the job waits here instead of hovering over it.
WAIT_X = 250.0
WAIT_Y = 120.0

[PNPTASK_PROC_1]
ID = 21
X = 450.0
Y = 250.0
Z_PICK = 4.0

; A station inside an enclosure: it sits in the fixture plate zones_alt.dxf
; draws at (150,150)..(220,260), so with deadzone-select = 1 there is no route
; to it at all — and with 0 there is. Instead of a taught wait position it
; names those two drawings (D29): the wait point is derived from where the
; route in first meets that zone, so the approach drives as far as it safely
; can and only stops if the station is still busy when it gets there.
[PNPTASK_PROC_2]
ID = 22
X = 185.0
Y = 205.0
Z_PICK = 4.0
WAIT_DEADZONE = 1
WAIT_CLEAR_DEADZONE = 0

; Travel between the tray and the press stays lower than the global
; MOVE_HEIGHT: nothing tall is in the way on that leg.
[PNPTASK_ROUTE_0]
ORIGIN = 10
DEST = 20
MOVE_HEIGHT = 20.0
