# stratuMAK joint limit planning test ([TRAJ]PLAN_JOINT_LIMITS).
#
# xyzac-trt-kins, the rotary table turning around its centre: a C rotation
# carries the X/Y joints on a circle around it.  The axes may run fast, the
# X/Y joints may not (20 mm/s), so a C move that holds the work point has to
# be planned by the joint limits; and the Y joint limits (+-40) lie inside
# the circle of radius 50 that a C180 at X50 sweeps.
[EMC]
VERSION = 1.1
MACHINE = joint-limits

[TASK]
TASK = milltask
CYCLE_TIME = 0.001

[RS274NGC]
PARAMETER_FILE = sim.var

[EMCMOT]
EMCMOT = motmod
BASE_PERIOD = 0
SERVO_PERIOD = 1000000

[HAL]
HALFILE = LIB:linuxcnc.hal
HALFILE = LIB:threads.hal
HALFILE = sim.hal

[TRAJ]
COORDINATES = X Y Z A C
LINEAR_UNITS = mm
ANGULAR_UNITS = degree
DEFAULT_LINEAR_VELOCITY = 100
MAX_LINEAR_VELOCITY = 200
MAX_ANGULAR_VELOCITY = 90
NO_FORCE_HOMING = 1
PLAN_JOINT_LIMITS = 1

[EMCIO]
EMCIO = io
CYCLE_TIME = 0.100
TOOL_TABLE = tool.tbl

[KINS]
KINEMATICS = xyzac-trt-kins
JOINTS = 5

[AXIS_X]
MIN_LIMIT = -100.0
MAX_LIMIT = 100.0
MAX_VELOCITY = 200
MAX_ACCELERATION = 2000.0

[AXIS_Y]
MIN_LIMIT = -100.0
MAX_LIMIT = 100.0
MAX_VELOCITY = 200
MAX_ACCELERATION = 2000.0

[AXIS_Z]
MIN_LIMIT = -100.0
MAX_LIMIT = 100.0
MAX_VELOCITY = 200
MAX_ACCELERATION = 2000.0

[AXIS_A]
MIN_LIMIT = -90.0
MAX_LIMIT = 90.0
MAX_VELOCITY = 90
MAX_ACCELERATION = 900.0

[AXIS_C]
MIN_LIMIT = -360.0
MAX_LIMIT = 360.0
MAX_VELOCITY = 90
MAX_ACCELERATION = 900.0

[JOINT_0]
TYPE = LINEAR
HOME_SEQUENCE = 0
MAX_VELOCITY = 20
MAX_ACCELERATION = 200.0
MIN_LIMIT = -100.0
MAX_LIMIT = 100.0

[JOINT_1]
TYPE = LINEAR
HOME_SEQUENCE = 0
MAX_VELOCITY = 20
MAX_ACCELERATION = 200.0
MIN_LIMIT = -40.0
MAX_LIMIT = 40.0

[JOINT_2]
TYPE = LINEAR
HOME_SEQUENCE = 0
MAX_VELOCITY = 200
MAX_ACCELERATION = 2000.0
MIN_LIMIT = -100.0
MAX_LIMIT = 100.0

[JOINT_3]
TYPE = ANGULAR
HOME_SEQUENCE = 0
MAX_VELOCITY = 90
MAX_ACCELERATION = 900.0
MIN_LIMIT = -90.0
MAX_LIMIT = 90.0

[JOINT_4]
TYPE = ANGULAR
HOME_SEQUENCE = 0
MAX_VELOCITY = 90
MAX_ACCELERATION = 900.0
MIN_LIMIT = -360.0
MAX_LIMIT = 360.0
