# Two task instances, left and right, sharing one server and one INI.
# Namespaced sections ([left.task:TRAJ]) override the global ones per instance.

[EMC]
VERSION = 1.1
MACHINE = multi-instance

[left.task:EMC]
MACHINE = Left

[right.task:EMC]
MACHINE = Right

[DISPLAY]
CYCLE_TIME = 0.100

[TASK]
TASK = milltask
CYCLE_TIME = 0.001

[left.task:RS274NGC]
PARAMETER_FILE = left.var

[right.task:RS274NGC]
PARAMETER_FILE = right.var

[EMCMOT]
SERVO_PERIOD = 1000000

[EMCIO]
CYCLE_TIME = 0.100
RANDOM_TOOLCHANGER = 0

[HAL]
HALFILE = multi.hal

[TRAJ]
COORDINATES = XYZ
LINEAR_UNITS = mm
ANGULAR_UNITS = degree
NO_FORCE_HOMING = 1
DEFAULT_LINEAR_VELOCITY = 30
MAX_LINEAR_VELOCITY = 50
DEFAULT_LINEAR_ACCELERATION = 500
MAX_LINEAR_ACCELERATION = 500

[KINS]
KINEMATICS = trivkins
JOINTS = 3

[AXIS_X]
MIN_LIMIT = -200
MAX_LIMIT = 200
MAX_VELOCITY = 50
MAX_ACCELERATION = 500

[AXIS_Y]
MIN_LIMIT = -200
MAX_LIMIT = 200
MAX_VELOCITY = 50
MAX_ACCELERATION = 500

[AXIS_Z]
MIN_LIMIT = -50
MAX_LIMIT = 100
MAX_VELOCITY = 50
MAX_ACCELERATION = 500

[JOINT_0]
TYPE = LINEAR
HOME = 0.0
HOME_SEQUENCE = 0
HOME_SEARCH_VEL = 0
HOME_LATCH_VEL = 0
MIN_LIMIT = -200
MAX_LIMIT = 200
MAX_VELOCITY = 50
MAX_ACCELERATION = 500
FERROR = 1.0
MIN_FERROR = 0.25

[JOINT_1]
TYPE = LINEAR
HOME = 0.0
HOME_SEQUENCE = 0
HOME_SEARCH_VEL = 0
HOME_LATCH_VEL = 0
MIN_LIMIT = -200
MAX_LIMIT = 200
MAX_VELOCITY = 50
MAX_ACCELERATION = 500
FERROR = 1.0
MIN_FERROR = 0.25

[JOINT_2]
TYPE = LINEAR
HOME = 0.0
HOME_SEQUENCE = 0
HOME_SEARCH_VEL = 0
HOME_LATCH_VEL = 0
MIN_LIMIT = -50
MAX_LIMIT = 100
MAX_VELOCITY = 50
MAX_ACCELERATION = 500
FERROR = 1.0
MIN_FERROR = 0.25
